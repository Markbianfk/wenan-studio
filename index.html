<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>边老师文案工作台</title>
<style>
:root{
  --bg:#FAF9F7; --panel:#FFFFFF; --ink:#141414; --ink-2:#57534E; --ink-3:#9C968E;
  --line:#E7E3DC; --line-2:#F1EDE6; --accent:#A63D2A; --accent-2:#F5EAE5;
  --c-pain:#A63D2A; --c-amplify:#8C5A2B; --c-turn:#2F4B57; --c-solve:#3F5F45;
  --c-joke:#8A7B33; --c-empathy:#6B4E63; --c-info:#3C4A6B; --c-hook:#141414; --c-after:#6E6862;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px;color:inherit}

.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:34px;height:34px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
.brand h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em}
.brand p{margin:1px 0 0;font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.status{font-size:11px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.04em}

.layout{display:grid;grid-template-columns:396px minmax(0,1fr);height:calc(100% - 76px)}
.editor{overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:24px 24px 60px}
.output{overflow-y:auto;padding:30px 34px 100px}
.editor::-webkit-scrollbar,.output::-webkit-scrollbar{width:8px}
.editor::-webkit-scrollbar-thumb,.output::-webkit-scrollbar-thumb{background:#E3DED5;border-radius:4px}

.field{margin-bottom:15px}
.field > label{display:block;font-size:10px;letter-spacing:.16em;color:var(--ink-3);margin-bottom:6px;text-transform:uppercase}
.field .sub{font-size:11px;color:var(--ink-3);letter-spacing:0;text-transform:none;margin-left:4px}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:2px;padding:9px 11px;outline:none;transition:border-color .15s}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{resize:vertical;line-height:1.9}
#ideas{min-height:150px}
#spots,#questions{min-height:90px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:2px;padding:6px 12px;font-size:12px;color:var(--ink-2);transition:all .15s}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.actions{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:11px 14px;font-size:13px;letter-spacing:.04em;border-radius:2px;transition:opacity .15s}
.btn:hover{opacity:.82}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.rule{height:1px;background:var(--line-2);margin:20px 0 16px}
.tips{font-size:11px;line-height:1.8;color:var(--ink-3)}
.tips b{color:var(--ink-2);font-weight:500}
.hidden{display:none!important}

.doc-head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
.doc-head .kicker{font-size:10px;letter-spacing:.18em;color:var(--ink-3);margin-bottom:6px}
.doc-head h2{margin:0;font-size:24px;font-weight:600;letter-spacing:.01em;line-height:1.35}
.doc-head .meta-line{margin-top:6px;font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.toolbar{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.toolbar .btn{flex:0 0 auto;padding:8px 14px;font-size:12px}

.stats{display:flex;gap:32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:20px;flex-wrap:wrap}
.stat .k{font-size:10px;letter-spacing:.14em;color:var(--ink-3);margin-bottom:2px}
.stat .v{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v small{font-size:11px;font-weight:400;color:var(--ink-3);margin-left:3px}
.stat .v.warnc{color:var(--accent)}

.sec-title{font-size:10px;letter-spacing:.16em;color:var(--ink-3);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line-2)}
.beats{display:flex;height:36px;border:1px solid var(--line);overflow:hidden;margin-bottom:10px;background:#fff}
.beat{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#fff;letter-spacing:.04em;border-right:1px solid rgba(255,255,255,.4);min-width:0;overflow:hidden;white-space:nowrap}
.beat:last-child{border-right:0}
.beat span{font-family:var(--mono);font-size:9px;opacity:.75}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--ink-3);margin-bottom:24px}
.legend i{display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:middle}

.unit{position:relative;background:#fff;border:1px solid var(--line);padding:15px 18px 13px;margin-bottom:12px}
.unit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rail,#ccc)}
.unit-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.idx{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.tag{font-size:11px;padding:1px 8px;border:1px solid currentColor;border-radius:2px;letter-spacing:.04em}
.spot{font-size:11px;padding:1px 8px;background:#F4F1EC;color:var(--ink-2);border-radius:2px}
.time{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.dur{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

.ln{margin:0 0 3px;font-size:16px;line-height:1.75;padding:2px 6px 2px 34px;margin-left:-6px;border-radius:2px;outline:none;position:relative;text-indent:-28px}
.ln::before{content:attr(data-k);position:absolute;left:6px;top:6px;font-size:9px;letter-spacing:.08em;color:var(--ink-3);border:1px solid var(--line);padding:0 3px;line-height:1.5;text-indent:0}
.ln:hover{background:#FBFAF8}
.ln:focus{background:#FBF6F3}
.ln.p1{font-weight:500}
.qa-q,.qa-a{font-size:16px;line-height:1.7;margin:0 0 6px;padding:4px 8px;border-radius:2px;outline:none}
.qa-q{background:#F7F4EF;border-left:2px solid var(--ink)}
.qa-a{background:#FAF9F6;border-left:2px solid var(--line)}
.qa-q b,.qa-a b{font-size:10px;letter-spacing:.1em;color:var(--ink-3);font-weight:500;margin-right:6px}
.hookline{font-size:12px;color:var(--accent);padding-left:10px;border-left:2px solid var(--accent);margin:8px 0 12px;line-height:1.7}
.hookline b{font-weight:500;opacity:.7;margin-right:4px;letter-spacing:.04em}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;border-top:1px solid var(--line-2);padding-top:11px;margin-top:10px}
.meta .k{font-size:10px;letter-spacing:.12em;color:var(--ink-3);margin-bottom:2px}
.meta .v{font-size:12.5px;line-height:1.65;color:var(--ink-2);outline:none;border-radius:2px;padding:1px 2px}
.meta .v:focus{background:#FBF6F3;color:var(--ink)}
.warn{margin-top:10px;font-size:11px;color:var(--accent);background:var(--accent-2);padding:5px 9px;border-radius:2px}
.empty{border:1px dashed var(--line);background:#fff;padding:60px 24px;text-align:center;color:var(--ink-3);font-size:13px;line-height:2}
.note{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;font-size:11px;color:var(--ink-3);line-height:1.9}
.note b{color:var(--ink-2);font-weight:500}
.note ol{margin:6px 0 0;padding-left:18px}


.syncbox{margin-top:10px;padding:12px;border:1px solid var(--line);background:#FBFAF8}
.syncbox input{margin-bottom:6px}
.stip{font-size:10.5px;color:var(--ink-3);line-height:1.6;margin-top:6px}
.liblist{margin-top:10px}
.librow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line-2);font-size:12px}
.librow:first-child{border-top:0}
.librow .lt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.librow .ld{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.librow button{background:none;border:0;color:var(--ink-3);font-size:11px;padding:0 4px}
.librow button:hover{color:var(--accent)}
.libempty{font-size:11px;color:var(--ink-3);padding:6px 0}
.scorebox{display:flex;gap:26px;align-items:center;border:1px solid var(--line);background:#fff;padding:16px 20px;margin-bottom:14px;flex-wrap:wrap}
.stotal{display:flex;flex-direction:column;align-items:flex-start;min-width:88px}
.stotal b{font-size:34px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.stotal small{font-size:11px;color:var(--ink-3);margin-top:2px}
.stotal span{font-size:10px;letter-spacing:.12em;color:var(--ink-3);margin-top:4px}
.dims{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;min-width:280px}
.dim .dk{font-size:10px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:4px}
.dim .dbar{height:3px;background:var(--line-2);margin-bottom:4px}
.dim .dbar i{display:block;height:3px}
.dim .dv{font-size:12px;font-variant-numeric:tabular-nums}
.dim .dv small{color:var(--ink-3);font-size:10px}
.issues{border:1px solid var(--line);background:#fff;padding:12px 16px;margin-bottom:22px}
.issues .ih{font-size:10px;letter-spacing:.12em;color:var(--accent);margin-bottom:8px}
.issues.pass{color:var(--ink-2);font-size:12.5px}
.issue{display:flex;gap:10px;font-size:12px;line-height:1.7;padding:5px 0;border-top:1px solid var(--line-2);color:var(--ink-2);flex-wrap:wrap}
.issue:first-of-type{border-top:0}
.ino{font-family:var(--mono);color:var(--ink-3);min-width:22px}
.itxt{flex:1;min-width:180px}
.ifix{color:var(--accent)}
.audit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;border:1px solid var(--line);background:#fff;padding:14px 18px;margin-bottom:22px}
.audit .k{font-size:10px;letter-spacing:.12em;color:var(--ink-3);margin-bottom:3px}
.audit .v{font-size:15px;font-weight:600}
.audit .v small{font-size:11px;font-weight:400;color:var(--ink-3);margin-left:2px}
.audit .v.bad{color:var(--accent)}
.audit-note{font-size:11px;color:var(--ink-3);margin:-14px 0 20px;line-height:1.7}
.script-full{border:1px solid var(--line);background:#fff;padding:20px 22px;margin-bottom:8px}
.script-full .para{font-size:15.5px;line-height:1.95;margin:0 0 12px;color:var(--ink)}
.script-full .para:last-child{margin-bottom:0}
@media (max-width:920px){
  .topbar{height:auto;padding:14px 16px;gap:10px}
  .brand p{display:none}
  .layout{display:block;height:auto}
  .editor{border-right:0;border-bottom:1px solid var(--line);padding:20px 16px 30px;overflow:visible}
  .output{padding:24px 16px 80px;overflow:visible}
  .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{gap:20px}
  .doc-head h2{font-size:20px}
  .ln,.qa-q,.qa-a{font-size:15px}
  .beats{height:30px}
}
@media print{
  .topbar,.editor,.toolbar,.note{display:none!important}
  .layout{display:block;height:auto}
  .output{padding:0;overflow:visible}
  body{background:#fff}
  .unit{break-inside:avoid;page-break-inside:avoid}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark">边</div>
    <div>
      <h1>边老师文案工作台</h1>
      <p>口播 · 探盘 · 采访　→　专业 · 大白话 · 幽默</p>
    </div>
  </div>
  <div class="status" id="status">待生成</div>
</header>

<main class="layout">

  <aside class="editor">
    <div class="field">
      <label>栏目类型</label>
      <div class="chips" id="typeChips">
        <button type="button" class="chip" data-type="talk" aria-pressed="true">口播</button>
        <button type="button" class="chip" data-type="tour" aria-pressed="false">探盘</button>
        <button type="button" class="chip" data-type="interview" aria-pressed="false">采访</button>
      </div>
    </div>

    <div class="field">
      <label>账号 / 栏目</label>
      <input type="text" id="account" value="说房的边老师">
    </div>

    <div class="field">
      <label>本条题目</label>
      <input type="text" id="topic" value="物业费欠费，带看第一件事不是看房">
    </div>

    <div class="field">
      <label>人设三句 <span class="sub">专业 · 大白话 · 幽默</span></label>
      <input type="text" id="persona" value="专业 + 大白话 + 幽默">
    </div>

    <div class="field">
      <label>核心内容 <span class="sub">一行一条，｜后填细节</span></label>
      <textarea id="ideas" spellcheck="false">看房三个月，没人主动告诉你物业欠费
客户原话：欠费的单子，我凭啥接着｜我听完没接话
欠费不结清，产权交易卡在网签环节
一年物业费加滞纳金，多摊两千多｜按一百平算
带看第一件事，去物业办公室查欠费台账
台账要看三页：欠费明细、催缴记录、维修基金
销售越绕开物业，越说明有事
选房先选物业，房子是壳，物业是日子
这话我一年要说几十遍</textarea>
    </div>

    <div class="field hidden" id="spotsField">
      <label>探盘路线点位 <span class="sub">一行一个，按拍摄顺序</span></label>
      <textarea id="spots" spellcheck="false">小区大门
园林步道
会所
样板间
地下车库</textarea>
    </div>

    <div class="field hidden" id="questionsField">
      <label>提问清单 <span class="sub">一行一个问题，按拍摄顺序</span></label>
      <textarea id="questions" spellcheck="false">这个盘今年卖了多少，剩下的都是什么户型
备案价和实际成交价差多少，为什么
园林和会所是交付前就有，还是后期补
物业是哪家，物业费多少，欠费怎么算
最不适合买的是哪一类客户</textarea>
    </div>

    <div class="field">
      <label>目标时长</label>
      <div class="chips" id="durChips">
        <button type="button" class="chip" data-sec="30" aria-pressed="false">30 秒</button>
        <button type="button" class="chip" data-sec="60" aria-pressed="true">60 秒</button>
        <button type="button" class="chip" data-sec="120" aria-pressed="false">2 分</button>
        <button type="button" class="chip" data-sec="180" aria-pressed="false">3 分</button>
        <button type="button" class="chip" data-sec="300" aria-pressed="false">5 分</button>
        <button type="button" class="chip" data-sec="480" aria-pressed="false">8 分</button>
        <button type="button" class="chip" data-sec="600" aria-pressed="false">10 分</button>
        <button type="button" class="chip" data-sec="900" aria-pressed="false">15 分</button>
      </div>
    </div>

    <div class="field">
      <label>语气基调</label>
      <select id="tone">
        <option value="sharp">犀利（不绕弯子）</option>
        <option value="steady" selected>笃定（说话算话）</option>
        <option value="warm">温和（慢慢说）</option>
      </select>
    </div>

    <div class="field">
      <label>开场钩子 <span class="sub">留空自动生成</span></label>
      <input type="text" id="hook" placeholder="例：这条只说一半，另一半在最后">
    </div>

    <div class="field">
      <label>结尾引导 <span class="sub">留空自动生成</span></label>
      <input type="text" id="cta" placeholder="例：想让我看你那套的台账，评论区留小区名">
    </div>

    <div class="actions">
      <button class="btn" id="genBtn">生成拍摄脚本</button>
      <button class="btn ghost" id="reshuffleBtn">换一套节拍</button>
    </div>

    <div class="rule"></div>

    <div class="field">
      <label>自媒体文案库 <span class="sub">保存在本机，可导出进「得到大脑」</span></label>
      <div class="actions" style="margin-top:0">
        <button class="btn ghost" id="saveLibBtn">存入文案库</button>
        <button class="btn ghost" id="exportBtn">导出终稿</button>
        <button class="btn ghost" id="syncBtn">同步到得到大脑</button>
      </div>
      <div class="syncbox hidden" id="syncCfg">
        <input type="text" id="gkKey" placeholder="API Key（gk_live_ 开头）" autocomplete="off">
        <input type="text" id="gkCid" placeholder="Client ID（cli_ 开头）" autocomplete="off">
        <input type="text" id="gkTopic" placeholder="知识库 topic_id" value="07owyNe0">
        <div class="actions" style="margin-top:8px">
          <button class="btn" id="gkSave">保存并同步</button>
          <button class="btn ghost" id="gkCancel">取消</button>
        </div>
        <div class="stip">Key 只存在这台设备的浏览器里，不会写进网页源码。</div>
      </div>
      <div class="liblist" id="libList"></div>
    </div>

    <div class="tips">
      <b>三种栏目：</b>口播按观点走；探盘按点位走，每点位 2–3 个单元；采访按问题走，一问一答。<br>
      <b>三句结构：</b>每单元拆成专业、大白话、幽默三句，8 秒刚好。<br>
      <b>时长</b>决定单元数，按每单元 7–8 秒估算，不够会提示差多少。<br>
      <b>想锁定功能：</b>行首加【痛点】【放大】【转折】【解法】【梗】【共情】【信息】。<br>
      <b>可改：</b>台词和标注直接点着改，导出按改后的算。
    </div>
  </aside>

  <section class="output" id="output">
    <div class="empty">
      选栏目、填核心内容，点「生成拍摄脚本」<br>
      这里出分镜单元：台词 · 镜头 · 时长 · 表情 · 动作 · 情绪
    </div>
  </section>

</main>

<script>
(function(){
  "use strict";

  var ROLE = {
    hook:    {label:"钩子",   tag:"开缺口",   color:"var(--c-hook)"},
    pain:    {label:"痛点",   tag:"抛痛点",   color:"var(--c-pain)"},
    amplify: {label:"放大",   tag:"加代价",   color:"var(--c-amplify)"},
    turn:    {label:"转折",   tag:"改一次口", color:"var(--c-turn)"},
    solve:   {label:"解法",   tag:"给路径",   color:"var(--c-solve)"},
    joke:    {label:"梗",     tag:"抛梗",     color:"var(--c-joke)"},
    empathy: {label:"共情",   tag:"给共情",   color:"var(--c-empathy)"},
    info:    {label:"新信息", tag:"补信息",   color:"var(--c-info)"},
    after:   {label:"收尾",   tag:"留缺口",   color:"var(--c-after)"}
  };

  /* 连接词：每个单元的开口句，负责把上一句接住（口播不能回看，逻辑必须显性） */
  var LEADS = {
    pain:    ["先说个真事。", "这事我上周刚碰上。", "你注意过没有？", "带看的时候最常见。"],
    amplify: ["更麻烦的在后头。", "这笔账算下来，", "代价不止这些。", "真正掏钱的是这里。"],
    turn:    ["但问题不在表面。", "往深一层看，", "反过来才看得清。", "关键不在这。"],
    solve:   ["怎么避？", "做法其实很简单。", "记住一个动作。", "我一般这么干。"],
    info:    ["还有一条，", "补个信息，", "这里有个细节。", "顺便说一句，"],
    joke:    ["说起来有点好笑。", "听着像段子。", "行吧。", "这话不好听。"],

  var PLAIN = {

  function strip(s){ return String(s || "").trim().replace(/[。！？，、；：\s]+$/g, ""); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function pick(a, seed, salt){ return a[Math.abs(seed + salt * 7) % a.length]; }
  function fmtTime(sec){ var m = Math.floor(sec/60), s = sec%60; return m + ":" + (s<10?"0"+s:s); }
  function cc(s){ return String(s).replace(/\s/g, "").length; }
  function clip(s, n){
    s = String(s).replace(/[。！？]+$/g,"").trim();
    if (s.length <= n + 6) return s;
    var cut = s.slice(0, n + 6);
    var p = Math.max(cut.lastIndexOf("，"), cut.lastIndexOf("："), cut.lastIndexOf("、"));
    return p >= 8 ? cut.slice(0, p) : cut;
  }

  /* ===== 去 AI 味 ===== */
  var SLOP = {
    "本质上":"说到底", "不可否认":"", "值得注意的是":"", "不难发现":"",
    "首先":"先说", "其次":"再说", "此外":"还有", "综上所述":"",

    "拥抱变化":"跟上", "真正的":"真", "非常重要":"很关键"
  };
  function deslop(str){
    var s = String(str);
    Object.keys(SLOP).forEach(function(k){ if (s.indexOf(k) > -1) s = s.split(k).join(SLOP[k]); });
    return s.replace(/[，]{2,}/g, "，").replace(/^[，、]/, "").trim();
  }

  /* ===== 体检：句长方差 / 超长句 / AI 味 ===== */
  function audit(text){
    var sents = text.split(/[。！？\n]+/).map(function(x){ return x.trim(); }).filter(Boolean);
    var lens = sents.map(function(x){ return x.length; });
    var n = lens.length || 1;
    var mean = lens.reduce(function(a,b){ return a+b; }, 0) / n;
    var varc = lens.reduce(function(a,b){ return a + (b-mean)*(b-mean); }, 0) / n;
    var sd = Math.sqrt(varc);
    var cv = mean ? sd / mean : 0;
    var longest = lens.length ? Math.max.apply(null, lens) : 0;
    var slop = 0;
    Object.keys(SLOP).forEach(function(k){ if (text.indexOf(k) > -1) slop++; });
    return {cv:cv, longest:longest, slop:slop, sentences:sents.length, mean:mean};
  }

  /* ===== 评分 ===== */
  function scoreAll(){
    var units = state.units || [];
    var issues = [];
    if (!units.length) return {total:0, dims:[], issues:issues};

    var s1 = 0, s2 = 0, s3 = 0, s4 = 0, s5 = 0;
    var roles = {};
    var withNum = 0;
    var lens = [];

    units.forEach(function(u, i){
      var num = (i+1<10?"0":"")+(i+1);
      var text = u.qa ? (u.qa.q + u.qa.a) : (u.lead||"") + u.parts.filter(Boolean).join("");
      var sents = text.split(/[。！？\n]+/).map(function(x){return x.trim();}).filter(Boolean);
      sents.forEach(function(x){ lens.push(cc(x)); });
      roles[u.role] = 1;

      /* 单点纯度 */
      var okPur = sents.length <= 4 && cc(text) <= 62;
      if (okPur) s1++;
      else issues.push({n:num, txt:"单元偏重（" + cc(text) + " 字 / " + sents.length + " 句），像塞了两件事", fix:"砍掉一句，或拆成两个单元"});

      /* 节拍 */
      var lo = u.role === "hook" ? 3 : (u.role === "after" ? 4 : 5);
      var hi = u.role === "hook" ? 6 : (u.role === "after" ? 8 : 10);
      if (u.dur >= lo && u.dur <= hi) s2++;
      else issues.push({n:num, txt:"时长 " + u.dur + " 秒，超出 " + lo + "–" + hi + " 秒节拍", fix:"增删半句，压回节拍内"});

      /* 口语度 */
      var bad = 0;
      Object.keys(SLOP).forEach(function(k){ if (text.indexOf(k) > -1) bad++; });

      /* 真实感 */
      if (/\d/.test(text) || /(块|元|万|平|天|次|年|月)/.test(text)) withNum++;
    });

    /* 起伏 */
    var n = lens.length || 1;
    var mean = lens.reduce(function(a,b){return a+b;},0)/n;
    var sd = Math.sqrt(lens.reduce(function(a,b){return a+(b-mean)*(b-mean);},0)/n);

    if (cv >= 0.3) s3 += 10; else issues.push({n:"全文", txt:"句长太匀（起伏 " + cv.toFixed(2) + "），听着像节拍器", fix:"把长句拆成短句，短句后接一句长的"});
    if (roleCount >= 5) s3 += 10; else issues.push({n:"全文", txt:"功能种类只有 " + roleCount + " 种，起伏不够", fix:"补一个梗或共情点"});

    s1 = Math.round(s1 / units.length * 20);
    s2 = Math.round(s2 / units.length * 20);
    s3 = Math.round(s3);
    s4 = Math.round(s4 / units.length * 20);
    s5 = Math.round(Math.min(1, withNum / Math.max(1, units.length * 0.4)) * 20);

    var total = s1 + s2 + s3 + s4 + s5;
    var dims = [
      {k:"单点纯度", v:s1, note:"一个单元只干一件事"},
      {k:"节拍密度", v:s2, note:"每拍 5–10 秒"},
      {k:"起伏", v:s3, note:"句长有长短，功能有变化"},
      {k:"口语度", v:s4, note:"没有书面腔和 AI 味"},
      {k:"具体度", v:s5, note:"有数字、有细节"}
    ];
    return {total:total, dims:dims, issues:issues};

  /* ===== 语义分类 ===== */
  var NUM = /(\d[\d,.]*\s*(元|块|万|千|平|个月|年|次|天)|多摊|滞纳金|几万|几千|百分之|一成|三成)/;
  var RULE = /(必须|不能|不得|要|得|规定|卡住|过户|税|产权|备案|违|罚)/;
  var METHOD = /(第一件事|先做|先看|先去|怎么查|怎么做|带看|核对|记得|别省|步骤|台账|清单|流程|看三页)/;
  var EXP = /(客户|销售|中介|带看|我碰|我遇|我见|他说|她说|问我)/;

  function contentType(t){
    if (NUM.test(t)) return "num";
    if (RULE.test(t)) return "rule";
    if (METHOD.test(t)) return "method";
    if (EXP.test(t)) return "exp";
    return "plain";
  }

  function detectRole(idea){
    var t = idea.t, d = idea.d, s = t + " " + d;
    if (/(原话|客户说|客户问|他问|她问|问我|说了句)/.test(s)) return "pain";
    if (METHOD.test(t)) return "solve";
    if (/(越.{0,8}越|其实不是|反过来|真正的问题|不是.{0,6}是|说白了|根子在)/.test(t)) return "turn";
    if (/(不容易|心疼|熬|扛|舍不得|不敢)/.test(t)) return "empathy";
    if (NUM.test(s)) return "amplify";
    return "default";
  }

  function reconcile(sem, pos, p){
    if (sem === "solve" && p < 0.6) return "info";
    if (sem === "turn" && p < 0.3) return "info";
    if (sem === "default") return pos;
    return sem;
  }

  function buildSequence(n){
    var seq = [], turnUsed = false;
    for (var i=0;i<n;i++){
      var p = n<=1?0.5:i/(n-1), r;
      if (p < 0.3) r = (i%3===2) ? "joke" : "pain";
      else if (p < 0.5) r = (i%3===1) ? "empathy" : "amplify";
      else if (!turnUsed && p < 0.68) { r = "turn"; turnUsed = true; }
      else if (p < 0.88) r = (i%3===2) ? "joke" : "solve";
      else r = "info";
      seq.push(r);
    }
    if (!turnUsed && n >= 3) seq[Math.floor(n*0.6)] = "turn";
    return seq;
  }

  function assignRoles(items){
    var n = items.length, pos = buildSequence(n);
    var roles = items.map(function(it,i){
      if (it.forced) return it.forced;
      return reconcile(detectRole(it), pos[i], n<=1?0.5:i/(n-1));
    });
    var ft = roles.indexOf("turn"), j;
    if (ft > -1){ for (j=0;j<ft;j++) if (roles[j]==="solve" && !items[j].forced) roles[j] = "info"; }
    var seen = false;
    roles = roles.map(function(r){ if (r==="turn"){ if (seen) return "info"; seen = true; } return r; });
    for (var i=2;i<roles.length;i++){
      if (roles[i]===roles[i-1] && roles[i-1]===roles[i-2] && !items[i-1].forced){
        roles[i-1] = (roles[i-1]==="empathy") ? "info" : "empathy";
      }
    }
    return roles;
  }

  /* ===== 三句：判断 → 翻译 → 情绪 ===== */
  function proOf(idea){

  function funOf(idea, role, allow){
    if (!allow) return "";

    var pool = (FUN[type] || FUN.plain).slice();

      if (!usedFun[pool[i]]){ usedFun[pool[i]] = 1; return pool[i]; }
    }
    return "";

  function triSet(idea, role, allowFun){
    var pro = proOf(idea);
    return [pro, plainOf(idea, pro, role), funOf(idea, role, allowFun)];

  /* ===== 解析 ===== */
  var TAGMAP = {"痛点":"pain","放大":"amplify","代价":"amplify","转折":"turn","解法":"solve","路径":"solve",
                "梗":"joke","共情":"empathy","信息":"info","爽点":"solve","钩子":"hook"};

  function splitSentences(line){
    var parts = String(line).split(/(?<=[。！？；])/).map(function(x){ return x.trim(); }).filter(Boolean);
    var out = [];
    parts.forEach(function(p2){
      if (out.length && cc(p2) < 7) out[out.length-1] += p2;
      else out.push(p2);
    });
    return out;
  }

  function parseItems(raw){
    var rows = [];
    String(raw).split(/\r?\n/).forEach(function(l){
      l = l.trim();
      if (!l) return;
      if (cc(l) > 42) splitSentences(l).forEach(function(x){ rows.push(x); });
      else rows.push(l);
    });
    return rows.map(function(line){
      var forced = "";
      var m = line.match(/^[\[【(（]\s*([^\]】)）]{1,4})\s*[\]】)）]\s*/);
      if (m && TAGMAP[m[1]]){ forced = TAGMAP[m[1]]; line = line.slice(m[0].length); }
      var parts = line.split(/\s*[|｜]\s*/);
      return {t: strip(parts[0]), d: parts[1] ? strip(parts.slice(1).join("｜")) : "", forced: forced};
    }).filter(function(x){ return x.t.length > 0; });
  }
  function parseLines(raw){
    return String(raw).split(/\r?\n/).map(function(l){ return strip(l); }).filter(Boolean);
  }

  /* ===== 生成 ===== */
  var state = {type:"talk", dur:60, units:[], total:0, topic:"", account:"", seed:7};
  var usedLead = {}, usedPlain = {}, usedFun = {};

  function leadFor(role, seed, i){
    var pool = LEADS[role] || [""];
    var idx = Math.abs(seed + i*3) % pool.length;
    if (pool[idx] && usedLead[pool[idx]]) idx = (idx+1) % pool.length;
    var v = pool[idx];
    if (v) usedLead[v] = 1;
    return v;
  }

  function slotOf(role){
    if (role === "hook") return "a";
    if (role === "after") return "e";
    if (role === "solve" || role === "info") return "c";
    if (role === "turn" || role === "joke" || role === "empathy") return "d";
    return "b";
  }

  function stageUnit(role, seed, i, type){
    var s = pick(SHOTS[type][slotOf(role)], seed, i+2);
    return {role:role, shot:s.shot, exp:s.exp, act:s.act, emo:s.emo, warn:""};
  }

  function build(){
    usedLead = {}; usedPlain = {}; usedFun = {};
    var type = state.type, seed = state.seed;
    var tone = document.getElementById("tone").value;
    var manualHook = strip(document.getElementById("hook").value);
    var cta = strip(document.getElementById("cta").value);
    var topic = strip(document.getElementById("topic").value);
    var ideas = parseItems(document.getElementById("ideas").value);
    var spots = parseLines(document.getElementById("spots").value);
    var questions = parseLines(document.getElementById("questions").value);

    if (type === "tour" && !spots.length) return {error:"探盘要先填路线点位。"};
    if (type === "interview" && !questions.length) return {error:"采访要先填提问清单。"};
    if (type !== "interview" && !ideas.length) return {error:"先写几条核心内容。"};

    var units = [], i;

    /* 钩子 */
    var hookText;
    if (manualHook) hookText = manualHook;
    else if (type === "tour") hookText = "这个盘我走了" + spots.length + "站，最值得停的是这一站。";
    else if (type === "interview") hookText = "我把这个盘的营销总按住了，问了" + questions.length + "个不好回答的问题。";
    else hookText = "先说结论：" + clip(ideas[0].t, 18) + "。";
    var hu = stageUnit("hook", seed, 0, type);
    hu.lead = ""; hu.parts = [hookText, "", ""];
    units.push(hu);

    var body = [];

    if (type === "talk"){
      var items = ideas.slice(1);
      var roles = assignRoles(items);
      items.forEach(function(idea, k){
        var role = roles[k];
        var u = stageUnit(role, seed, k+1, type);
        u.parts = triSet(idea, role, role === "joke" || k % 4 === 2);
        body.push(u);
      });
    }

    if (type === "tour"){
      var targetCount = Math.round(state.dur / 8);
      var perSpot = Math.max(2, Math.min(8, Math.ceil((targetCount - 2) / Math.max(1, spots.length))));
      var idx = 0;
      spots.forEach(function(spot, si){
        for (var p=0;p<perSpot;p++){
          var idea = ideas[idx % ideas.length]; idx++;
          var role = p === 0 ? "pain" : (p === perSpot-1 ? "solve" : (si % 2 ? "amplify" : "info"));
          if (si === spots.length-1 && p === perSpot-1) role = "empathy";
          var u = stageUnit(role, seed, si*4+p+1, type);
          u.parts = triSet(idea, role, role === "joke" || p === 1);
          u.spot = spot;
          body.push(u);
        }
      });
    }

    if (type === "interview"){
      questions.forEach(function(q, qi){
        var u = stageUnit(qi===0?"pain":"info", seed, qi+1, type);
        u.qa = {q:q, a:"（营销总的回答，现场记录）"};
        u.parts = [q,"",""];
        body.push(u);
      });
    }

    /* 串联：每个单元以上一个单元的过渡句开口 */
    var prev = units[0];
    body.forEach(function(u, k){
      u.lead = (k % 3 === 0) ? leadFor(u.role, seed, k+1) : "";
      prev = u;
    });

    units = units.concat(body);

    var tail = tone === "sharp" ? "别嫌我说话直。" : (tone === "warm" ? "不着急，慢慢看。" : "");
    var afterText = cta || (type === "interview"
      ? "这五个问题问完，剩下的你自己去看一眼更实在。"
      : "下次带看，先拐去物业办公室，翻那三页纸。" + tail);
    var au = stageUnit("after", seed, units.length+1, type);
    au.lead = ""; au.parts = [afterText, "", ""];
    units.push(au);

    units.forEach(function(u){ u.parts = u.parts.map(function(x){ return x ? deslop(x) : x; }); });
    units.forEach(function(u){ if (u.lead) u.lead = deslop(u.lead); });

    /* 时间轴 */
    var t = 0;
    units.forEach(function(u){
      var text = (u.lead || "") + u.parts.filter(Boolean).join("");
      if (u.qa) text = u.qa.q;
      u.line = text;
      var chars = cc(text), dur;
      if (u.role === "hook") dur = Math.max(3, Math.min(6, Math.round(chars/4.5)||4));
      else if (u.role === "after") dur = Math.max(4, Math.min(8, Math.round(chars/4.5)||5));
      else dur = Math.max(5, Math.min(11, Math.round(chars/4.5)||7));
      if (u.qa){
        var qd = Math.max(3, Math.min(5, Math.round(cc(u.qa.q)/4.5)||3));
        var ad = Math.max(5, Math.min(10, Math.round(cc(u.qa.a||"")/4.5)||6));
        dur = qd + ad;
      }
      u.dur = dur; u.chars = chars; u.start = t; t += dur; u.end = t;
      if (!u.qa && u.role !== "hook" && u.role !== "after" && chars > 58){
        u.warn = "这段 " + chars + " 字，超过 11 秒，砍掉半句或拆成两个单元。";
      }
    });

    state.units = units;
    state.total = t;
    state.topic = document.getElementById("topic").value;
    state.account = document.getElementById("account").value;
    return {units: units};
  }

  function fullScript(){
    return state.units.map(function(u){
      if (u.qa) return "我问：" + u.qa.q + "\n他说：" + u.qa.a;
      return (u.lead || "") + u.parts.filter(Boolean).join("");
    }).join("\n\n");
  }

  /* ===== 渲染 ===== */
  function render(){
    var r = build();
    var out = document.getElementById("output");
    if (r.error){
      out.innerHTML = '<div class="empty">' + esc(r.error) + '</div>';
      document.getElementById("status").textContent = "需补内容";
      return;
    }
    var units = state.units, total = state.total;
    var targetCount = Math.round(state.dur / 8);
    var diff = units.length - targetCount;

    var stats = '<div class="stats">' +
      '<div class="stat"><div class="k">总时长</div><div class="v">' + total + '<small>秒</small></div></div>' +
      '<div class="stat"><div class="k">单元数</div><div class="v">' + units.length + '</div></div>' +
      '<div class="stat"><div class="k">目标时长</div><div class="v">' + state.dur + '<small>秒</small></div></div>' +
      '<div class="stat"><div class="k">目标单元</div><div class="v" style="color:' + (diff<0?"var(--accent)":"inherit") + '">' + targetCount + '</div></div>' +
    '</div>';

    var beats = '<div class="beats">' + units.map(function(u){
      var rr = ROLE[u.role];
      return '<div class="beat" style="flex:' + u.dur + ';background:' + rr.color + '">' + rr.label + '<span>' + u.dur + 's</span></div>';
    }).join("") + '</div>';

    var legend = '<div class="legend">' + Object.keys(ROLE).map(function(k){
      return '<span><i style="background:' + ROLE[k].color + '"></i>' + ROLE[k].label + ' ' + ROLE[k].tag + '</span>';
    }).join("") + '</div>';

    var cards = units.map(function(u, i){
      var rr = ROLE[u.role], num = (i+1<10?"0":"") + (i+1);
      var body;
      if (u.qa){
        body = '<p class="qa-q" contenteditable="true" data-f="qa.q"><b>我问</b>' + esc(u.qa.q) + '</p>' +
               '<p class="qa-a" contenteditable="true" data-f="qa.a"><b>他说</b>' + esc(u.qa.a) + '</p>';
      } else if (u.parts[1]){
        body = '<p class="ln" data-k="接" contenteditable="true" data-f="lead">' + esc(u.lead || "") + '</p>' +
               '<p class="ln p1" data-k="专业" contenteditable="true" data-f="p0">' + esc(u.parts[0]) + '</p>' +
               '<p class="ln" data-k="白话" contenteditable="true" data-f="p1">' + esc(u.parts[1]) + '</p>' +
               '<p class="ln" data-k="幽默" contenteditable="true" data-f="p2">' + esc(u.parts[2]) + '</p>';
      } else {
        body = '<p class="ln p1" data-k="台词" contenteditable="true" data-f="p0">' + esc(u.parts[0]) + '</p>';
      }
      return '<article class="unit" data-i="' + i + '" style="--rail:' + rr.color + '">' +
        '<div class="unit-head">' +
          '<span class="idx">' + num + '</span>' +
          '<span class="tag" style="color:' + rr.color + '">' + rr.tag + '</span>' +
          (u.spot ? '<span class="spot">' + esc(u.spot) + '</span>' : '') +
          '<span class="dur">' + u.dur + ' 秒 · ' + u.chars + ' 字</span>' +
          '<span class="time">' + fmtTime(u.start) + ' – ' + fmtTime(u.end) + '</span>' +
        '</div>' + body +
        '<div class="meta">' +
          '<div><div class="k">镜头</div><div class="v" contenteditable="true" data-f="shot">' + esc(u.shot) + '</div></div>' +
          '<div><div class="k">表情</div><div class="v" contenteditable="true" data-f="exp">' + esc(u.exp) + '</div></div>' +
          '<div><div class="k">动作</div><div class="v" contenteditable="true" data-f="act">' + esc(u.act) + '</div></div>' +
          '<div><div class="k">情绪</div><div class="v" contenteditable="true" data-f="emo">' + esc(u.emo) + '</div></div>' +
        '</div>' + (u.warn ? '<div class="warn">' + esc(u.warn) + '</div>' : "") +
      '</article>';
    }).join("");

    var fscript = fullScript();
    var sc = scoreAll();
    var dimHtml = sc.dims.map(function(d){
      return '<div class="dim"><div class="dk">' + d.k + '</div>' +
        '<div class="dbar"><i style="width:' + (d.v/20*100) + '%;background:' + (d.v>=15?"var(--ink)":"var(--accent)") + '"></i></div>' +
        '<div class="dv">' + d.v + '<small>/20</small></div></div>';
    }).join("");
    var issueHtml = sc.issues.length
      ? '<div class="issues"><div class="ih">待改 ' + sc.issues.length + ' 处</div>' + sc.issues.slice(0,10).map(function(it){
          return '<div class="issue"><span class="ino">' + it.n + '</span><span class="itxt">' + esc(it.txt) + '</span><span class="ifix">' + esc(it.fix) + '</span></div>';
        }).join("") + '</div>'
      : '<div class="issues pass">全部达标：单点、节拍、起伏、口语、具体度都过线。</div>';
    var scoreHtml = '<div class="scorebox"><div class="stotal"><b>' + sc.total + '</b><small>/100</small><span>综合评分</span></div><div class="dims">' + dimHtml + '</div></div>' + issueHtml;

    var typeName = {talk:"口播", tour:"探盘", interview:"采访"}[state.type];
    var tip = "";
    if (diff < 0){
      tip = '<div class="warn" style="margin-bottom:16px">还差 ' + (-diff) + ' 个单元才到 ' + state.dur + ' 秒：口播加观点，探盘加点位，采访加问题。</div>';
    } else if (total > state.dur * 1.15){
      tip = '<div class="warn" style="margin-bottom:16px">超出目标 ' + (total - state.dur) + ' 秒：删掉 ' + diff + ' 个单元，或把最长的几句砍半。</div>';
    }

    out.innerHTML =
      '<div class="doc-head">' +
        '<div class="kicker">' + esc(state.account) + ' · ' + typeName + '</div>' +
        '<h2>' + esc(state.topic) + '</h2>' +
        '<div class="meta-line">' + total + ' 秒　/　' + units.length + ' 个单元　/　每单元只干一件事</div>' +
      '</div>' +
      '<div class="toolbar">' +
        '<button class="btn ghost" id="copyScriptBtn">复制口播稿</button>' +
        '<button class="btn ghost" id="recheckBtn">重新体检</button>' +
        '<button class="btn ghost" id="copyBtn">复制分镜表</button>' +
        '<button class="btn ghost" id="mdBtn">下载 Markdown</button>' +
        '<button class="btn ghost" id="printBtn">打印 / 存 PDF</button>' +
      '</div>' +
      stats + tip +
      '<div class="sec-title">口播稿（照着念）</div>' +
      scoreHtml +
      '<div class="script-full" id="fullScript">' + esc(fscript).replace(/\n\n/g, '</p><p class="para">').replace(/^/, '<p class="para">') + '</p></div>' +
      '<div class="sec-title" style="margin-top:26px">节拍骨架</div>' + beats + legend +
      '<div class="sec-title">分镜单元</div>' + cards +
      '<div class="note"><b>写法依据：</b>一句一个意思，句长控制在 22 字内；每单元开口先给连接词，观众不能回看，逻辑必须显性；结论前置，解法压在六成之后。</div>';

    document.getElementById("status").textContent = typeName + " · " + total + "秒 / " + units.length + "单元";

    out.querySelectorAll(".unit").forEach(function(el){
      var i = Number(el.dataset.i);
      el.querySelectorAll("[contenteditable]").forEach(function(node){
        node.addEventListener("input", function(){
          var f = node.dataset.f, v = node.textContent.trim();
          if (f === "qa.q") state.units[i].qa.q = v;
          else if (f === "qa.a") state.units[i].qa.a = v;
          else if (f === "lead") state.units[i].lead = v;
          else if (f === "p0") state.units[i].parts[0] = v;
          else if (f === "p1") state.units[i].parts[1] = v;
          else if (f === "p2") state.units[i].parts[2] = v;
          else state.units[i][f] = v;
          var fs = document.getElementById("fullScript");
          if (fs) fs.innerHTML = esc(fullScript()).replace(/\n\n/g, '</p><p class="para">').replace(/^/, '<p class="para">') + '</p>';
        });
      });
    });

    document.getElementById("copyScriptBtn").onclick = function(){ copyText(fullScript()); };
    document.getElementById("recheckBtn").onclick = function(){ render(); };
    document.getElementById("copyBtn").onclick = function(){ copyText(toMarkdown()); };
    document.getElementById("mdBtn").onclick = downloadMd;
    document.getElementById("printBtn").onclick = function(){ window.print(); };
    save();
  }

  /* ===== 导出 ===== */
  function toMarkdown(){
    var d = new Date();
    var stamp = d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
    var L = ["# " + state.topic, "", "> 库：自媒体文案库　｜　" + stamp, "", "总时长 " + state.total + " 秒｜" + state.units.length + " 个单元｜账号 " + state.account, "", "## 口播稿", ""];
    L.push(fullScript());
    L.push("", "## 分镜", "");
    state.units.forEach(function(u,i){
      var rr = ROLE[u.role], num = (i+1<10?"0":"")+(i+1);
      L.push("### " + num + "｜" + rr.tag + (u.spot?"｜"+u.spot:"") + "｜" + fmtTime(u.start) + "–" + fmtTime(u.end) + "（" + u.dur + "秒）");
      if (u.qa){ L.push("我问：" + u.qa.q); L.push("他说：" + u.qa.a); }
      else {
        if (u.lead) L.push("接：" + u.lead);
        L.push("台词：" + u.parts.filter(Boolean).join(""));
      }
      L.push("镜头：" + u.shot);
      L.push("表情：" + u.exp + "｜动作：" + u.act + "｜情绪：" + u.emo);
      L.push("");
    });
    return L.join("\n");
  }

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ flash("已复制"); }, function(){ fb(text); });
    } else fb(text);
  }
  function fb(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); flash("已复制"); } catch(e){ flash("复制失败"); }
    document.body.removeChild(ta);
  }
  function downloadMd(){
    var blob = new Blob([toMarkdown()], {type:"text/markdown;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "自媒体文案库-" + (state.topic || "口播稿") + ".md";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 300);
    flash("已下载");
  }
  function flash(msg){
    var s = document.getElementById("status"), old = s.textContent;
    s.textContent = msg;
    setTimeout(function(){ s.textContent = old; }, 1400);
  }

  /* ===== 自媒体文案库 ===== */
  var LIB = "wenan-lib-v1";
  function libAll(){
    try { return JSON.parse(localStorage.getItem(LIB) || "[]"); } catch(e){ return []; }
  }
  function libWrite(arr){
    try { localStorage.setItem(LIB, JSON.stringify(arr.slice(0,50))); } catch(e){}
  }
  function libRender(){
    var box = document.getElementById("libList");
    if (!box) return;
    var arr = libAll();
    if (!arr.length){ box.innerHTML = '<div class="libempty">还没有存过稿子</div>'; return; }
    box.innerHTML = arr.map(function(it){
      return '<div class="librow"><span class="ld">' + it.date + '</span><span class="lt">' + esc(it.title) + '</span>' +
        '<button data-load="' + it.id + '">打开</button><button data-del="' + it.id + '">删</button></div>';
    }).join("");
    box.querySelectorAll("[data-load]").forEach(function(b){
      b.onclick = function(){
        var rec = libAll().filter(function(x){ return x.id === b.dataset.load; })[0];
        if (!rec) return;
        ["account","topic","ideas","spots","questions","hook","cta","persona"].forEach(function(k){
          if (rec.form && rec.form[k] != null && document.getElementById(k)) document.getElementById(k).value = rec.form[k];
        });
        if (rec.form && rec.form.type){ state.type = rec.form.type; syncTypeFields(); }
        if (rec.form && rec.form.dur) state.dur = rec.form.dur;
        render();
        flash("已打开");
      };
    });
    box.querySelectorAll("[data-del]").forEach(function(b){
      b.onclick = function(){
        libWrite(libAll().filter(function(x){ return x.id !== b.dataset.del; }));
        libRender();
      };
    });
  }
  function libSave(){
    if (!state.units.length){ flash("先生成"); return; }
    var d = new Date();
    var date = d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
    var rec = {
      id: "w" + Date.now(),
      title: state.topic || "未命名",
      date: date,
      md: toMarkdown(),
      form: {
        type: state.type, dur: state.dur,
        account: document.getElementById("account").value,
        topic: document.getElementById("topic").value,
        ideas: document.getElementById("ideas").value,
        spots: document.getElementById("spots").value,
        questions: document.getElementById("questions").value,
        hook: document.getElementById("hook").value,
        cta: document.getElementById("cta").value,
        persona: document.getElementById("persona").value
      }
    };
    var arr = libAll();
    arr.unshift(rec);
    libWrite(arr);
    libRender();
    flash("已存入文案库");
  }

  /* ===== 同步到得到大脑 ===== */
  var GK = "gk_cfg_v1";
  var GK_BASE = "https://openapi.biji.com/open/api/v1";
  function gkCfg(){
    try { return JSON.parse(localStorage.getItem(GK) || "null"); } catch(e){ return null; }
  }
  function gkShow(on){
    document.getElementById("syncCfg").classList.toggle("hidden", !on);
    var c = gkCfg();
    if (on && c){
      document.getElementById("gkKey").value = c.key || "";
      document.getElementById("gkCid").value = c.cid || "";
      document.getElementById("gkTopic").value = c.topic || "07owyNe0";
    }
  }
  function gkSync(){
    if (!state.units.length){ flash("先生成"); return; }
    var key = document.getElementById("gkKey").value.trim();
    var cid = document.getElementById("gkCid").value.trim();
    var topic = document.getElementById("gkTopic").value.trim() || "07owyNe0";
    if (!key || !cid){ flash("先填 Key 和 Client ID"); return; }
    try { localStorage.setItem(GK, JSON.stringify({key:key, cid:cid, topic:topic})); } catch(e){}

    var d = new Date();
    var stamp = d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
    var payload = {
      note_type: "plain_text",
      title: (state.topic || "未命名") + "｜" + stamp,
      content: toMarkdown(),
      tags: ["自媒体文案库", {talk:"口播",tour:"探盘",interview:"采访"}[state.type] || "口播"],
      topic_id: topic
    };
    flash("同步中…");
    fetch(GK_BASE + "/resource/note/save", {
      method: "POST",
      headers: {"Authorization": key, "X-Client-ID": cid, "Content-Type": "application/json"},
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.success){ flash("已同步到得到大脑"); gkShow(false); }
      else { flash("同步失败：" + ((j && j.error && (j.error.message || j.error.reason)) || "检查 Key")); }
    }).catch(function(e){ flash("同步失败：" + (e && e.message ? e.message : "网络")); });
  }

  /* ===== 存储 ===== */
  var KEY = "wenan-studio-v3";
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        type: state.type, dur: state.dur,
        account: document.getElementById("account").value,
        topic: document.getElementById("topic").value,
        persona: document.getElementById("persona").value,
        ideas: document.getElementById("ideas").value,
        spots: document.getElementById("spots").value,
        questions: document.getElementById("questions").value,
        tone: document.getElementById("tone").value,
        hook: document.getElementById("hook").value,
        cta: document.getElementById("cta").value
      }));
    }catch(e){}
  }
  function restore(){
    var raw = null;
    try{ raw = localStorage.getItem(KEY); }catch(e){}
    if (!raw){ syncTypeFields(); return; }
    try{
      var d = JSON.parse(raw);
      ["account","topic","persona","ideas","spots","questions","tone","hook","cta"].forEach(function(k){
        if (d[k] != null && document.getElementById(k)) document.getElementById(k).value = d[k];
      });
      if (d.type){
        state.type = d.type;
        document.querySelectorAll("#typeChips .chip").forEach(function(c){ c.setAttribute("aria-pressed", String(c.dataset.type === d.type)); });
      }
      if (d.dur){
        state.dur = d.dur;
        document.querySelectorAll("#durChips .chip").forEach(function(c){ c.setAttribute("aria-pressed", String(Number(c.dataset.sec) === d.dur)); });
      }
    }catch(e){}
    syncTypeFields();
  }

  function syncTypeFields(){
    document.getElementById("spotsField").classList.toggle("hidden", state.type !== "tour");
    document.getElementById("questionsField").classList.toggle("hidden", state.type !== "interview");
  }

  document.querySelectorAll("#typeChips .chip").forEach(function(c){
    c.addEventListener("click", function(){
      document.querySelectorAll("#typeChips .chip").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
      c.setAttribute("aria-pressed","true");
      state.type = c.dataset.type;
      syncTypeFields(); save();
    });
  });
  document.querySelectorAll("#durChips .chip").forEach(function(c){
    c.addEventListener("click", function(){
      document.querySelectorAll("#durChips .chip").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
      c.setAttribute("aria-pressed","true");
      state.dur = Number(c.dataset.sec); save();
    });
  });

  document.getElementById("genBtn").addEventListener("click", function(){
    state.seed = Math.floor(Math.random()*997); render();
  });
  document.getElementById("reshuffleBtn").addEventListener("click", function(){
    state.seed = Math.floor(Math.random()*997); render();
  });
  ["account","topic","persona","ideas","spots","questions","tone","hook","cta"].forEach(function(id){
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("input", save);
    el.addEventListener("change", save);
  });

  document.getElementById("saveLibBtn").addEventListener("click", libSave);
  document.getElementById("syncBtn").addEventListener("click", function(){
    var c = gkCfg();
    if (c && c.key && c.cid) gkSync(); else gkShow(true);
  });
  document.getElementById("gkSave").addEventListener("click", gkSync);
  document.getElementById("gkCancel").addEventListener("click", function(){ gkShow(false); });
  document.getElementById("exportBtn").addEventListener("click", function(){
    if (!state.units.length){ flash("先生成"); return; }
    downloadMd();
  });
  libRender();

  restore();
  if (document.getElementById("ideas").value.trim()) render();
})();
</script>
</body>
</html>
